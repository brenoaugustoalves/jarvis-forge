services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jarvis_forge
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: jarvis_dev_only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis_forge"]
      interval: 5s
      timeout: 5s
      retries: 10
  jarvis-forge:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://jarvis:jarvis_dev_only@postgres:5432/jarvis_forge
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
